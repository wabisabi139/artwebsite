<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muchukota Shria — Art</title>
  <meta name="description" content="Fine art portfolio of Muchukota Shria: watercolours, acrylics, sketches, and self-portraits.">
  <meta property="og:title" content="Muchukota Shria — Art">
  <meta property="og:description" content="Watercolours, acrylics, and self-portrait artwork by Muchukota Shria.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#art-content" class="sr-only skip-link">Skip to main content</a>

  <!-- Navigation strip above artboard per specification -->
  <div class="nav-strip">
    <nav class="site-nav" aria-label="Main">
      <a href="/#about">ABOUT</a>
      <span class="nav-sep" aria-hidden="true">&#183;</span>
      <a href="/education/">EDUCATION</a>
      <span class="nav-sep" aria-hidden="true">&#183;</span>
      <a href="/posters/">POSTERS</a>
      <span class="nav-sep" aria-hidden="true">&#183;</span>
      <a href="/art/" aria-current="page">ART</a>
    </nav>
  </div>

  <div class="page-wrapper">
    <main class="artboard" id="art-content">
      <!-- Section Heading: WATERCOLOUR AND ACRYLIC. -->
      <h1 class="p4-title">WATERCOLOUR AND ACRYLIC.</h1>

      <!-- Art Gallery Grid (desktop: display contents; mobile: 2-column staggered grid) -->
      <div class="p4-grid-container">
        <!-- Left Column -->
        <div class="p4-col p4-col-1">
          <!-- Orange Hands Watercolor -->
          <div class="p4-hands">
            <img src="/images/art-hands-orange.jpg"
                 alt="Watercolor painting of two hands holding a crumpled pale-blue cloth with an orange background"
                 width="771"
                 height="594"
                 decoding="async">
          </div>

          <!-- Anime Tote Bag Ink Drawing Cutout -->
          <div class="p4-tote">
            <img src="/images/art-tote-bag.png"
                 alt="Canvas tote bag with black ink drawing of three masked anime-style characters"
                 width="450"
                 height="800"
                 decoding="async">
          </div>

          <!-- Section Label: SELF - PORTRAITS. -->
          <div class="p4-selfportraits-label">
            <div>SELF -</div>
            <div>PORTRAITS.</div>
          </div>

          <!-- Seated Self-Portrait Cutout with Organic Tan Blob Background -->
          <div class="p4-seated-wrap">
            <svg class="tan-blob" viewBox="0 0 320 400" aria-hidden="true" focusable="false">
              <path d="M 160 25 C 200 22 235 48 245 88 C 262 110 272 138 268 170 C 285 205 300 248 310 300 C 318 345 320 380 320 400 L 0 400 C 0 380 2 345 10 300 C 20 248 35 205 52 170 C 48 138 58 110 75 88 C 85 48 120 22 160 25 Z" fill="#B7A06C" />
            </svg>
            <img src="/images/art-selfportrait-seated.png"
                 alt="Pencil and charcoal sketch cutout of a person with hand on cheek holding a pen"
                 width="922"
                 height="1229"
                 loading="lazy"
                 decoding="async">
          </div>
        </div>

        <!-- Right Column -->
        <div class="p4-col p4-col-2">
          <!-- Bodhisattva Padmapani Painting -->
          <div class="p4-padmapani">
            <img src="/images/art-padmapani.jpg"
                 alt="Ajanta-style watercolor painting of Bodhisattva Padmapani holding a pink lotus flower"
                 width="788"
                 height="1229"
                 decoding="async">
          </div>

          <!-- Self-Portrait Upward Climb with Offset Maroon Shadow -->
          <div class="p4-upward-wrap">
            <div class="p4-upward-shadow" aria-hidden="true"></div>
            <img src="/images/art-selfportrait-upward.jpg"
                 alt="Charcoal self-portrait seen from above with handwritten note 'It\'s an upward climb.'"
                 width="810"
                 height="1229"
                 loading="lazy"
                 decoding="async">
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/main.js" defer></script>
</body>
</html>
