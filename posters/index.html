<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muchukota Shria — Posters</title>
  <meta name="description" content="Graphic design and poster portfolio by Muchukota Shria: science communication, nutrition design, and creative layouts.">
  <meta property="og:title" content="Muchukota Shria — Posters">
  <meta property="og:description" content="Science communication and creative poster designs by Muchukota Shria.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#posters-content" class="sr-only skip-link">Skip to main content</a>

  <div class="page-wrapper">
    <main class="artboard" id="posters-content">
      <!-- Site Navigation inside artboard per specification (empty band above posters) -->
      <div class="p3-nav-pos">
        <nav class="site-nav" aria-label="Main">
          <a href="/#about">ABOUT</a>
          <span class="nav-sep" aria-hidden="true">&#183;</span>
          <a href="/education/">EDUCATION</a>
          <span class="nav-sep" aria-hidden="true">&#183;</span>
          <a href="/posters/" aria-current="page">POSTERS</a>
          <span class="nav-sep" aria-hidden="true">&#183;</span>
          <a href="/art/">ART</a>
        </nav>
      </div>

      <!-- Cancer Research Conference Poster -->
      <div class="p3-grid-item p3-cancer">
        <img src="/images/poster-cancer.png"
             alt="Sample Poster for a Cancer Research Conference with yellow virus motif pattern"
             width="635"
             height="898"
             decoding="async">
      </div>

      <!-- Meal Plan Poster -->
      <div class="p3-grid-item p3-meal">
        <img src="/images/poster-meal.png"
             alt="Meal planning poster featuring photos of Indian meals and a cartoon character with speech bubble saying 'Let's build a meal plan!'"
             width="540"
             height="675"
             decoding="async">
      </div>

      <!-- Macromolecules Poster -->
      <div class="p3-grid-item p3-macromolecules">
        <img src="/images/poster-macromolecules.png"
             alt="Educational poster showing three macromolecules: Proteins, Carbs, Fats arranged on a teal plate"
             width="540"
             height="675"
             loading="lazy"
             decoding="async">
      </div>

      <!-- Free as a Cloud Poster -->
      <div class="p3-grid-item p3-cloud">
        <img src="/images/poster-cloud.png"
             alt="Landscape poster with photographic cloud cutouts on a dark blue background reading 'Free as a cloud.'"
             width="800"
             height="566"
             loading="lazy"
             decoding="async">
      </div>

      <!-- Section Label: POSTERS. -->
      <h1 class="p3-label">POSTERS.</h1>
    </main>
  </div>

  <script src="/js/main.js" defer></script>
</body>
</html>
